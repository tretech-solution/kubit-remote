# KuBIT Remote - Android arm64 APK (direct download) and AAB (Google Play upload).
# Same steps as upstream build-rustdesk-android (flutter-build.yml), aarch64 only, signed with the KuBIT key.
# Manual start only; the output is a workflow artifact (published on the KuBIT Assist Downloads page by hand).
# Secrets: KUBIT_ANDROID_KEYSTORE_B64 (base64 PKCS12 keystore, alias "kubitremote"), KUBIT_ANDROID_KEYSTORE_PASSWORD.
name: KuBIT Android arm64 build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"
  APP_NAME: "KuBIT-Remote"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-android-arm64:
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    env:
      TARGET: aarch64-linux-android
      # Compiled into the app (option_env!): version 1.5.3.<build>.
      KUBIT_BUILD: ${{ github.run_number }}
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KUBIT_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KUBIT_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KUBIT_ANDROID_KEYSTORE_B64 / KUBIT_ANDROID_KEYSTORE_PASSWORD secrets are missing"
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang cmake curl gcc-multilib git g++ g++-multilib libayatana-appindicator3-dev libasound2-dev \
               libc6-dev libclang-dev libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev \
               libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxdo-dev libxfixes-dev \
               llvm-dev nasm ninja-build openjdk-17-jdk-headless pkg-config tree wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh arm64-v8a; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: kubit-android
          key: ${{ env.TARGET }}

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add $TARGET
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/$TARGET/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so

      - name: Signing config
        env:
          KEYSTORE_B64: ${{ secrets.KUBIT_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KUBIT_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > ./flutter/android/app/kubit-release.p12
          {
            echo "storeFile=kubit-release.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=kubitremote"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > ./flutter/android/key.properties

      - name: Build APK and AAB
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          pushd flutter
          # versionCode must grow with every build, or Android refuses to install the APK over the previous one.
          flutter build apk --release --target-platform android-arm64 --split-per-abi \
            --build-name ${{ env.VERSION }} --build-number $((100 + GITHUB_RUN_NUMBER))
          # Google Play accepts only App Bundles for new apps.
          flutter build appbundle --release --target-platform android-arm64 \
            --build-name ${{ env.VERSION }} --build-number $((100 + GITHUB_RUN_NUMBER))
          popd
          mkdir -p SignOutput
          mv flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "SignOutput/${{ env.APP_NAME }}-${{ env.VERSION }}.${{ github.run_number }}-arm64.apk"
          mv flutter/build/app/outputs/bundle/release/app-release.aab \
            "SignOutput/${{ env.APP_NAME }}-${{ env.VERSION }}.${{ github.run_number }}.aab"
          rm -f ./flutter/android/app/kubit-release.p12 ./flutter/android/key.properties

      - name: Verify signature
        run: |
          APKSIGNER=$(ls -d /usr/local/lib/android/sdk/build-tools/*/apksigner | tail -n 1)
          "$APKSIGNER" verify --print-certs SignOutput/*.apk | tee SignOutput/certificate.txt
          grep -q "kubitremote\|KuBIT" SignOutput/certificate.txt || { echo "::error::APK is not signed with the KuBIT key"; exit 1; }

      - name: SHA-256
        run: sha256sum SignOutput/*.apk SignOutput/*.aab | tee SignOutput/sha256sums.txt

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kubit-remote-android-arm64
          path: SignOutput
          if-no-files-found: error
